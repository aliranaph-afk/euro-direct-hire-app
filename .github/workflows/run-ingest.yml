name: Run Ingest Script

on:
  schedule:
    - cron: '0 0 * * *' # Every day at 8:00 AM PHT
  workflow_dispatch:

jobs:
  run-ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d32aece185cd1ad4062093a17e # v4.0.4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Execute ingestion script
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node ingest.js

      - name: Send Email Notification
        if: always() # Ensures notification sends whether job succeeded or failed
        uses: dawidd6/action-send-mail@2cea9617b09d79a095af21254fbcb7ae95903dde # v3.12.0
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Ingestion Pipeline Status: ${{ job.status }} (${{ github.date }})"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: GitHub Actions Workflow
          body: |
            The Daily Job Ingestion Pipeline has finished executing.

            Status: ${{ job.status }}
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}

            View run logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
