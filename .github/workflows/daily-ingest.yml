name: Daily Direct-Hire Job Ingestion

on:
  schedule:
    # Runs daily at 02:00 UTC (10:00 AM PHT)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Write Service Account JSON Key
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GCP_SERVICE_ACCOUNT_JSON" > service_account.json

      - name: Execute Ingestion Pipeline
        run: node ingest.js
